<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 2e — BiRefNet-lite</title>
<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --text: #18181b;
    --muted: #71717a;
    --accent: #2563eb;
    --border: #e4e4e7;
    --error: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b;
      --card: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #60a5fa;
      --border: #3f3f46;
      --error: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, sans-serif;
    font-size: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  button, .file-label {
    display: block;
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    text-align: center;
    cursor: pointer;
  }
  button.small { padding: 10px; font-size: 14px; margin: 0 0 12px; }
  button:disabled { opacity: 0.4; cursor: default; }
  input[type="file"] { display: none; }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 14px;
  }
  .row select {
    max-width: 62%;
    padding: 8px;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
  }
  .row input[type="color"] { width: 64px; height: 40px; border: none; background: none; }
  .info { line-height: 1.6; }
  .error { color: var(--error); }
  .result-card h2 { font-size: 15px; margin: 0 0 4px; word-break: break-all; }
  .result-card .meta { color: var(--muted); font-size: 14px; margin-bottom: 8px; line-height: 1.5; }
  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .pair figcaption { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .pair figure { margin: 0; }
  .pair canvas {
    width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 6px;
    display: block;
  }
</style>
</head>
<body>

<h1>Test 2e — BiRefNet-lite</h1>

<div class="card">
  <label class="file-label" for="fileInput">Wybierz do 6 zdjęć</label>
  <input type="file" id="fileInput" accept="image/png, image/jpeg" multiple>

  <label class="row">Model
    <select id="modelSelect">
      <option value="h143N/birefnet-lite-512-chunked|512" selected>BiRefNet-lite 512 (mało pamięci)</option>
      <option value="jiabins0303/birefnet-lite-1024-webgpu|1024">BiRefNet-lite 1024 (tylko GPU, eksperyment)</option>
    </select>
  </label>
  <label class="row">Procesor
    <select id="deviceSelect">
      <option value="wasm" selected>CPU</option>
      <option value="webgpu">GPU / WebGPU (zawsze fp32)</option>
    </select>
  </label>
  <label class="row">Dokładność liczb (tylko CPU)
    <select id="dtypeSelect">
      <option value="fp16" selected>fp16 (mniejszy plik)</option>
      <option value="fp32">fp32 (większy plik)</option>
    </select>
  </label>
  <label class="row">Kolor tła testowego
    <input type="color" id="bgColor" value="#00ff00">
  </label>

  <button id="startBtn" disabled>Start</button>
</div>

<div class="card info" id="status">Wczytywanie biblioteki…</div>

<div id="results"></div>

<script type="module">
// ===== USTAWIENIA =====
const LIB_URL = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.2.0'; // przypięta wersja
const MAX_FILES = 6;
const DARK_THRESHOLD = 25;
const ROW_BLACK_RATIO = 0.7;
const MEAN = [0.485, 0.456, 0.406]; // normalizacja kolorów używana przez BiRefNet
const STD = [0.229, 0.224, 0.225];

// ===== ELEMENTY STRONY =====
const fileInput = document.getElementById('fileInput');
const startBtn = document.getElementById('startBtn');
const bgColor = document.getElementById('bgColor');
const modelSelect = document.getElementById('modelSelect');
const deviceSelect = document.getElementById('deviceSelect');
const dtypeSelect = document.getElementById('dtypeSelect');
const statusBox = document.getElementById('status');
const resultsBox = document.getElementById('results');

let files = [];
const states = [];
let loaded = { key: null, model: null };

// ===== WCZYTANIE BIBLIOTEKI =====
let AutoModel = null;
let Tensor = null;
try {
  const lib = await import(LIB_URL);
  AutoModel = lib.AutoModel;
  Tensor = lib.Tensor;
  setStatus(
    'Biblioteka gotowa. Wybierz zdjęcia.<br>' +
    `<small>WebGPU: <b>${navigator.gpu ? 'jest' : 'brak'}</b> · ` +
    `izolacja (wielowątkowość CPU): <b>${self.crossOriginIsolated ? 'tak' : 'nie'}</b> · ` +
    `rdzenie: <b>${navigator.hardwareConcurrency || '?'}</b> · ` +
    `RAM (szac.): <b>${navigator.deviceMemory ? navigator.deviceMemory + ' GB' : '?'}</b></small>`
  );
} catch (err) {
  console.error(err);
  setStatus(`<span class="error">Nie udało się wczytać biblioteki: ${escapeHtml(err.message)}</span>`);
}

// ===== WYBÓR PLIKÓW: od razu kopiujemy je do pamięci, żeby uchwyty do galerii nie wygasły =====
fileInput.addEventListener('change', async () => {
  const picked = Array.from(fileInput.files).slice(0, MAX_FILES);
  startBtn.disabled = true;
  setStatus('Wczytywanie wybranych plików do pamięci…');
  try {
    files = [];
    for (const f of picked) {
      const buf = await f.arrayBuffer();
      files.push(new File([buf], f.name, { type: f.type }));
    }
    startBtn.disabled = files.length === 0 || !AutoModel;
    setStatus(files.length
      ? `Wybrano zdjęć: <b>${files.length}</b>. Kliknij Start.`
      : 'Wybierz zdjęcia, żeby zacząć.');
  } catch (err) {
    files = [];
    setStatus(`<span class="error">Nie udało się odczytać plików: ${escapeHtml(err.message)}. Wybierz je ponownie.</span>`);
  }
});

bgColor.addEventListener('change', () => states.forEach(render));

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  fileInput.disabled = true;
  resultsBox.innerHTML = '';
  states.length = 0;

  const [modelId, sizeStr] = modelSelect.value.split('|');
  const size = Number(sizeStr);
  const device = deviceSelect.value;
  const dtype = device === 'webgpu' ? 'fp32' : dtypeSelect.value; // GPU w telefonie nie obsługuje fp16
  const times = [];

  try {
    const tLoad = performance.now();
    const model = await getModel(modelId, device, dtype);
    const loadSeconds = (performance.now() - tLoad) / 1000;

    for (let i = 0; i < files.length; i++) {
      const label = `Zdjęcie ${i + 1} z ${files.length}`;
      try {
        const seconds = await processFile(files[i], label, model, size, `${modelId.split('/')[1]} · ${device} · ${dtype}`);
        times.push(seconds);
      } catch (err) {
        console.error(err);
        addError(files[i].name, err.message || String(err));
      }
    }

    const rest = times.slice(1);
    const avg = rest.length ? rest.reduce((a, b) => a + b, 0) / rest.length : null;
    setStatus(
      `Gotowe: <b>${modelId.split('/')[1]}</b> + <b>${device}</b> + <b>${dtype}</b>.<br>` +
      `Wczytanie modelu: <b>${loadSeconds.toFixed(1)} s</b> · Przetworzono: <b>${times.length}</b> z ${files.length}` +
      (times.length === 0 ? '<br>Żadne zdjęcie się nie przetworzyło — zobacz błędy poniżej.' : '') +
      (avg !== null
        ? `<br>Średni czas na zdjęcie (bez pierwszego): <b>${avg.toFixed(1)} s</b>` +
          `<br>Szacunek dla 200 zdjęć: <b>${Math.round(avg * 200 / 60)} min</b>`
        : '')
    );
  } catch (err) {
    console.error(err);
    setStatus(
      `<span class="error">Błąd modelu: ${escapeHtml(err.message || String(err))}</span><br>` +
      'Odśwież stronę przed kolejną próbą.'
    );
  }

  startBtn.disabled = false;
  fileInput.disabled = false;
});

// ===== WCZYTANIE MODELU =====
async function getModel(modelId, device, dtype) {
  const key = `${modelId}|${device}|${dtype}`;
  if (loaded.key === key) return loaded.model;

  if (loaded.model && loaded.model.dispose) {
    try { await loaded.model.dispose(); } catch (e) { /* ignorujemy */ }
  }
  loaded = { key: null, model: null };

  setStatus('Pobieranie modelu…');
  const model = await AutoModel.from_pretrained(modelId, {
    device,
    dtype,
    progress_callback: p => {
      if (p.status === 'progress' && typeof p.progress === 'number') {
        const file = p.file ? p.file.split('/').pop() : '';
        setStatus(`Pobieranie modelu (tylko za pierwszym razem): ${escapeHtml(file)} ${Math.round(p.progress)}%`);
      }
    }
  });
  loaded = { key, model };
  return model;
}

// ===== PRZETWARZANIE JEDNEGO ZDJĘCIA =====
async function processFile(file, label, model, size, modelLabel) {
  setStatus(`${label}: wczytywanie…`);
  const img = await loadImage(file);

  const src = document.createElement('canvas');
  src.width = img.naturalWidth;
  src.height = img.naturalHeight;
  const sctx = src.getContext('2d', { willReadFrequently: true });
  sctx.drawImage(img, 0, 0);
  img.src = '';

  // 1. Przycięcie czarnych pasów
  const { top, bottom } = detectBars(sctx, src.width, src.height);
  const w = src.width;
  const h = src.height - top - bottom;
  if (h <= 0) throw new Error('Całe zdjęcie wygląda na czarne.');

  const crop = document.createElement('canvas');
  crop.width = w;
  crop.height = h;
  const cropCtx = crop.getContext('2d', { willReadFrequently: true });
  cropCtx.drawImage(src, 0, top, w, h, 0, 0, w, h);
  src.width = 0; // zwalniamy pamięć dużego płótna
  src.height = 0;

  // 2. Wycięcie modelem
  setStatus(`${label}: przetwarzanie modelem…`);
  const t0 = performance.now();
  const input = makeInput(crop, size);
  const outputs = await runModel(model, input);
  const { small, W, H } = await toMask(outputs);
  const alpha = upscaleMask(small, W, H, w, h);
  const seconds = (performance.now() - t0) / 1000;

  // 3. Statystyki maski
  let clear = 0, mid = 0, solid = 0;
  for (let i = 0; i < alpha.length; i++) {
    const a = alpha[i];
    if (a < 26) clear++;
    else if (a >= 230) solid++;
    else mid++;
  }
  const pct = n => Math.round(n / alpha.length * 100);
  const stats = `tło ${pct(clear)}% · produkt ${pct(solid)}% · półprzezroczyste ${pct(mid)}%`;

  const out = document.createElement('canvas');
  out.width = w;
  out.height = h;

  const st = { w, h, alpha, cropCtx, out, showMask: false };
  addResult(file.name, seconds, top, bottom, modelLabel, stats, crop, st);
  render(st);
  return seconds;
}

// Wejście modelu: skalowanie do kwadratu size × size i normalizacja kolorów
function makeInput(cropCanvas, size) {
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(cropCanvas, 0, 0, size, size);
  const px = ctx.getImageData(0, 0, size, size).data;
  c.width = 0;
  c.height = 0;

  const n = size * size;
  const data = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    data[i] = (px[i * 4] / 255 - MEAN[0]) / STD[0];
    data[n + i] = (px[i * 4 + 1] / 255 - MEAN[1]) / STD[1];
    data[2 * n + i] = (px[i * 4 + 2] / 255 - MEAN[2]) / STD[2];
  }
  return new Tensor('float32', data, [1, 3, size, size]);
}

// Różne eksporty nazywają wejście inaczej, więc próbujemy kilku nazw
async function runModel(model, input) {
  const names = ['input_image', 'pixel_values', 'input'];
  let lastErr = null;
  for (const name of names) {
    try {
      return await model({ [name]: input });
    } catch (e) {
      lastErr = e;
      if (!/input|missing|feed/i.test(String(e && e.message))) throw e;
    }
  }
  throw lastErr;
}

// Odczyt wyniku modelu — próbujemy kilku sposobów, bo API zmienia się między wersjami
async function readTensor(t) {
  const tries = [];
  if (typeof t.getData === 'function') tries.push(() => t.getData());
  if (t.ort_tensor && typeof t.ort_tensor.getData === 'function') tries.push(() => t.ort_tensor.getData());
  tries.push(async () => t.data);

  let lastErr = null;
  for (const attempt of tries) {
    try {
      const d = await attempt();
      if (d && d.length) return d;
    } catch (e) {
      lastErr = e;
    }
  }
  const methods = Object.getOwnPropertyNames(Object.getPrototypeOf(t)).join(', ');
  throw new Error('Nie mogę odczytać wyniku modelu. ' + (lastErr ? lastErr.message : '') + ' [metody: ' + methods + ']');
}

// Zamiana wyniku modelu na maskę 0–255
async function toMask(outputs) {
  const t = Object.values(outputs)[0];
  const raw = await readTensor(t);
  const get = raw instanceof Uint16Array ? i => halfToFloat(raw[i]) : i => raw[i];
  const dims = t.dims || t.shape;
  const H = dims[dims.length - 2];
  const W = dims[dims.length - 1];
  const n = W * H;

  const vals = new Float32Array(n);
  let min = Infinity, max = -Infinity;
  for (let i = 0; i < n; i++) {
    const v = get(i);
    vals[i] = v;
    if (v < min) min = v;
    if (v > max) max = v;
  }
  const isProbability = min >= 0 && max <= 1;
  const small = new Uint8ClampedArray(n);
  for (let i = 0; i < n; i++) {
    const p = isProbability ? vals[i] : 1 / (1 + Math.exp(-vals[i])); // sigmoid
    small[i] = Math.round(Math.min(1, Math.max(0, p)) * 255);
  }
  try { if (t.dispose) t.dispose(); } catch (e) { /* ignorujemy */ }
  return { small, W, H };
}

function halfToFloat(h) {
  const s = (h & 0x8000) ? -1 : 1;
  const e = (h & 0x7C00) >> 10;
  const f = h & 0x03FF;
  if (e === 0) return s * Math.pow(2, -14) * (f / 1024);
  if (e === 0x1F) return f ? NaN : s * Infinity;
  return s * Math.pow(2, e - 15) * (1 + f / 1024);
}

// Powiększenie maski z rozmiaru modelu do rozmiaru zdjęcia
function upscaleMask(small, W, H, w, h) {
  const c = document.createElement('canvas');
  c.width = W;
  c.height = H;
  const cx = c.getContext('2d');
  const img = cx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = small[i];
    img.data[i * 4 + 3] = 255;
  }
  cx.putImageData(img, 0, 0);

  const big = document.createElement('canvas');
  big.width = w;
  big.height = h;
  const bx = big.getContext('2d', { willReadFrequently: true });
  bx.imageSmoothingEnabled = true;
  bx.imageSmoothingQuality = 'high';
  bx.drawImage(c, 0, 0, w, h);
  const d = bx.getImageData(0, 0, w, h).data;

  const alpha = new Uint8ClampedArray(w * h);
  for (let i = 0; i < alpha.length; i++) alpha[i] = d[i * 4];
  big.width = 0;
  big.height = 0;
  return alpha;
}

// ===== SKŁADANIE WYNIKU =====
function render(st) {
  const ctx = st.out.getContext('2d');

  if (st.showMask) {
    const img = ctx.createImageData(st.w, st.h);
    for (let i = 0; i < st.alpha.length; i++) {
      img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = st.alpha[i];
      img.data[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    return;
  }

  const px = st.cropCtx.getImageData(0, 0, st.w, st.h);
  for (let i = 0; i < st.alpha.length; i++) px.data[i * 4 + 3] = st.alpha[i];

  const tmp = document.createElement('canvas');
  tmp.width = st.w;
  tmp.height = st.h;
  tmp.getContext('2d').putImageData(px, 0, 0);

  ctx.fillStyle = bgColor.value;
  ctx.fillRect(0, 0, st.w, st.h);
  ctx.drawImage(tmp, 0, 0);
  tmp.width = 0;
  tmp.height = 0;
}

// ===== FUNKCJE POMOCNICZE =====
function detectBars(ctx, width, height) {
  const data = ctx.getImageData(0, 0, width, height).data;

  function isRowBlack(y) {
    let dark = 0;
    const rowStart = y * width * 4;
    for (let x = 0; x < width; x++) {
      const i = rowStart + x * 4;
      if (data[i] <= DARK_THRESHOLD &&
          data[i + 1] <= DARK_THRESHOLD &&
          data[i + 2] <= DARK_THRESHOLD) {
        dark++;
      }
    }
    return dark / width >= ROW_BLACK_RATIO;
  }

  let top = 0;
  while (top < height && isRowBlack(top)) top++;

  let bottom = 0;
  while (bottom < height - top && isRowBlack(height - 1 - bottom)) bottom++;

  return { top, bottom };
}

function loadImageOnce(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('nie udało się wczytać obrazu')); };
    img.src = url;
  });
}

// Do 3 prób z przerwą — przy chwilowym braku pamięci druga próba często się udaje
async function loadImage(blob) {
  let lastErr = null;
  for (let i = 0; i < 3; i++) {
    try {
      return await loadImageOnce(blob);
    } catch (e) {
      lastErr = e;
      await new Promise(r => setTimeout(r, 700));
    }
  }
  throw lastErr;
}

function setStatus(html) {
  statusBox.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function addResult(name, seconds, top, bottom, modelLabel, stats, cropCanvas, st) {
  const card = document.createElement('div');
  card.className = 'card result-card';
  card.innerHTML =
    `<h2></h2>` +
    `<div class="meta">Czas: <b>${seconds.toFixed(1)} s</b> · ${escapeHtml(modelLabel)} · pasy: ${top} / ${bottom} px<br>` +
    `${stats}</div>` +
    `<button class="small">Pokaż maskę</button>` +
    `<div class="pair">` +
    `<figure><figcaption>Po przycięciu</figcaption></figure>` +
    `<figure><figcaption>Po wycięciu</figcaption></figure>` +
    `</div>`;
  card.querySelector('h2').textContent = name;

  const btn = card.querySelector('button');
  btn.addEventListener('click', () => {
    st.showMask = !st.showMask;
    btn.textContent = st.showMask ? 'Pokaż wynik' : 'Pokaż maskę';
    render(st);
  });

  const figs = card.querySelectorAll('figure');
  figs[0].appendChild(cropCanvas);
  figs[1].appendChild(st.out);

  resultsBox.appendChild(card);
  states.push(st);
}

function addError(name, message) {
  const card = document.createElement('div');
  card.className = 'card result-card';
  card.innerHTML = `<h2></h2><div class="error"></div>`;
  card.querySelector('h2').textContent = name;
  card.querySelector('.error').textContent = 'Błąd: ' + message;
  resultsBox.appendChild(card);
}
</script>
</body>
</html>
